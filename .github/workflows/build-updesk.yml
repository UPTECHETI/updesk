name: Build UpDesk for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'assets/**'
      - '.github/workflows/build-updesk.yml'

env:
  RUST_VERSION: "1.75"
  SCITER_RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_BRIDGE_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUSTDESK_VERSION: "1.3.8"
  UPDESK_SERVER: "updesk.uptech.eti.br"
  UPDESK_KEY: "qiTu+VUce5K1VE3JZJeHS3+8MY96ihiiG40pA9RAMCc="

jobs:
  # ── Job 1: Generate flutter-rust-bridge files (Linux Ubuntu 22.04) ───────────
  generate-bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clone RustDesk ${{ env.RUSTDESK_VERSION }}
        run: |
          git clone --depth 1 \
            --branch ${{ env.RUSTDESK_VERSION }} \
            --recurse-submodules \
            https://github.com/rustdesk/rustdesk.git rustdesk-src

      - name: Install build prerequisites
        timeout-minutes: 15
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ \
            libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04
          workspaces: rustdesk-src

      - name: Install Flutter (for bridge codegen)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Install flutter-rust-bridge codegen
        run: |
          cargo install cargo-expand \
            --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen \
            --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} \
            --features "uuid" --locked
          cd rustdesk-src/flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Generate bridge files
        run: |
          cd rustdesk-src
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h \
             ./flutter/ios/Runner/bridge_generated.h
          ls -la src/bridge_generated.rs flutter/lib/generated_bridge.dart

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            rustdesk-src/src/bridge_generated.rs
            rustdesk-src/src/bridge_generated.io.rs
            rustdesk-src/flutter/lib/generated_bridge.dart
            rustdesk-src/flutter/lib/generated_bridge.freezed.dart
            rustdesk-src/flutter/macos/Runner/bridge_generated.h
            rustdesk-src/flutter/ios/Runner/bridge_generated.h

  # ── Job 2: Build UpDesk for Windows x64 ──────────────────────────────────────
  build-windows:
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Clone RustDesk ${{ env.RUSTDESK_VERSION }}
        shell: bash
        run: |
          git clone --depth 1 \
            --branch ${{ env.RUSTDESK_VERSION }} \
            --recurse-submodules \
            https://github.com/rustdesk/rustdesk.git rustdesk-src

      - name: Download bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: bridge-out

      - name: Restore bridge files
        shell: bash
        run: |
          echo "=== bridge-out structure ==="
          find bridge-out/ -type f | sort
          echo "==="
          cp -v bridge-out/src/bridge_generated.rs    rustdesk-src/src/
          cp -v bridge-out/src/bridge_generated.io.rs rustdesk-src/src/ 2>/dev/null || true
          cp -v bridge-out/flutter/lib/generated_bridge.dart         rustdesk-src/flutter/lib/
          cp -v bridge-out/flutter/lib/generated_bridge.freezed.dart rustdesk-src/flutter/lib/ 2>/dev/null || true
          cp -v bridge-out/flutter/macos/Runner/bridge_generated.h   rustdesk-src/flutter/macos/Runner/ 2>/dev/null || true
          cp -v bridge-out/flutter/ios/Runner/bridge_generated.h     rustdesk-src/flutter/ios/Runner/ 2>/dev/null || true
          echo "=== Verification ==="
          ls -la rustdesk-src/src/bridge_generated.rs || { echo "FATAL: bridge_generated.rs missing"; exit 1; }
          ls -la rustdesk-src/flutter/lib/generated_bridge.dart || { echo "FATAL: generated_bridge.dart missing"; exit 1; }
          echo "Bridge files restored successfully."

      - name: Apply UpDesk patches
        shell: bash
        env:
          UPDESK_SERVER: ${{ env.UPDESK_SERVER }}
          UPDESK_KEY: ${{ env.UPDESK_KEY }}
        run: python3 patches/apply_patches.py

      - name: Export GHA cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace Flutter engine (RustDesk custom build)
        shell: pwsh
        run: |
          Set-Location rustdesk-src
          flutter doctor -v
          flutter precache --windows
          $engineUri = "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip"
          Invoke-WebRequest -Uri $engineUri -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterRoot = (Get-Command flutter).Source | Split-Path | Split-Path
          $engineDst  = "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release"
          Move-Item -Force windows-x64-release\* $engineDst

      - name: Patch Flutter dropdown
        shell: bash
        run: |
          patchfile="rustdesk-src/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          flutter_parent="$(dirname $(dirname $(which flutter)))"
          cp "$patchfile" "$flutter_parent/"
          cd "$flutter_parent"
          git apply "flutter_3.24.4_dropdown_menu_enableFilter.diff" 2>/dev/null || \
            echo "Flutter patch already applied or not needed."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022
          workspaces: rustdesk-src


      - name: Install nasm (workaround for MSYS2 mirror 404)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo 'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false


      - name: Patch vcpkg msys2-runtime (3.5.4-2 removido dos mirrors -> 3.6.10-3)
        shell: pwsh
        run: |
          $file = "C:\vcpkg\scripts\cmake\vcpkg_acquire_msys.cmake"
          $old_url = 'URL "https://mirror.msys2.org/msys/x86_64/msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst"'
          $new_url = 'URL "https://mirror.msys2.org/msys/x86_64/msys2-runtime-3.6.10-3-x86_64.pkg.tar.zst"'
          $old_sha = 'SHA512 070aeb43385beb0e3f8d5fb28909469765116c222d53c2614f5f080be879eef0b78258334b35e8cda7625d8704efc89133f8b8fa78f309c5d680ae270efdaba8'
          $new_sha = 'SHA512 14529e14c965b3f446279c30e86e1b9f823e8f92d0fb82ad9b75a27e8e9a75aede63342567728091d2803e8d967083997a7406c71fca79926f89bf34caf076a4'
          $c = Get-Content $file -Raw
          $c = $c.Replace($old_url, $new_url).Replace($old_sha, $new_sha)
          [System.IO.File]::WriteAllText($file, $c)
          Write-Host "vcpkg_acquire_msys.cmake patched:"
          Select-String "msys2-runtime" $file | Select-Object -ExpandProperty Line

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        working-directory: rustdesk-src
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed" || {
            find "$VCPKG_ROOT/" -name "*.log" -exec sh -c 'echo "=== {} ==="; cat "{}"' \;
            exit 1
          }

      - name: Patch flutter_gpu_texture_renderer (missing chrono header)
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          # Pre-run flutter pub get to create ephemeral plugin symlinks
          Set-Location flutter
          flutter pub get
          Set-Location ..

          # Patch d3d11_output.cpp — missing #include <chrono> causes MSVC error C2039
          $pluginFile = "flutter\windows\flutter\ephemeral\.plugin_symlinks\flutter_gpu_texture_renderer\windows\d3d11_output.cpp"
          if (Test-Path $pluginFile) {
            $fc = Get-Content $pluginFile -Raw
            if ($fc -notmatch '#include <chrono>') {
              $fc = "#include <chrono>`r`n" + $fc
              [System.IO.File]::WriteAllText((Resolve-Path $pluginFile).Path, $fc)
              Write-Host "Patched: $pluginFile"
            } else {
              Write-Host "Already has chrono include"
            }
          } else {
            Write-Host "WARNING: Plugin file not at expected path, searching pub cache..."
            $pubCache = "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev"
            if (Test-Path $pubCache) {
              Get-ChildItem -Path $pubCache -Recurse -Filter "d3d11_output.cpp" | ForEach-Object {
                Write-Host "Found: $($_.FullName)"
                $fc = Get-Content $_.FullName -Raw
                if ($fc -notmatch '#include <chrono>') {
                  $fc = "#include <chrono>`r`n" + $fc
                  [System.IO.File]::WriteAllText($_.FullName, $fc)
                  Write-Host "Patched pub cache file"
                }
              }
            }
          }

      - name: Build UpDesk
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" `
            -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe",
                            "usbmmidd_v2\deviceinstaller.exe",
                            "usbmmidd_v2\usbmmidd.bat" `
            -ErrorAction SilentlyContinue
          $release = "flutter\build\windows\x64\runner\Release"
          if (Test-Path $release) {
            Move-Item $release ..\updesk-release
            Write-Host "Build output moved to updesk-release/"
          } else {
            Write-Error "Release folder not found at: $release"
            Get-ChildItem -Recurse -Filter "*.exe" flutter\build\ | Select FullName
            exit 1
          }
          Move-Item -Force .\usbmmidd_v2 ..\updesk-release\

      - name: Build NSIS installer
        shell: pwsh
        run: |
          makensis updesk.nsi
          Write-Host "Installer size: $((Get-Item 'UpDesk-Setup.exe').Length / 1MB) MB"

      - name: Upload UpDesk artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpDesk-Setup
          path: UpDesk-Setup.exe
          retention-days: 30


      - name: Deploy to Hostinger (uptech.eti.br/downloads/UpDesk-Setup.exe)
        if: success()
        shell: bash
        run: |
          echo "Fazendo upload para Hostinger..."
          curl -s --ftp-ssl-allow -T UpDesk-Setup.exe \
            "ftp://${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_HOST }}/downloads/UpDesk-Setup.exe"
          echo "Deploy concluído: https://uptech.eti.br/downloads/UpDesk-Setup.exe"

      - name: Build summary
        shell: bash
        run: |
          echo "## UpDesk build concluido" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Base | RustDesk ${{ env.RUSTDESK_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Servidor | ${{ env.UPDESK_SERVER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Modo | Receiver-only |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | updesk-windows-x64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baixe na aba Actions > Artifacts." >> $GITHUB_STEP_SUMMARY
